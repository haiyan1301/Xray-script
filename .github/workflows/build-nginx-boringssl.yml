name: Build Nginx with BoringSSL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'service/nginx.sh'
      - '.github/workflows/build-nginx-boringssl.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: build-nginx-boringssl
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Nginx/BoringSSL binary
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      NGINX_PREFIX: /usr/local/nginx
      NGINX_LOG_PATH: /var/log/nginx
      BUILD_ROOT: ${{ github.workspace }}/nginx-boringssl-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl wget gcc g++ make git openssl tzdata socat cmake \
            dnsutils perl-base perl golang-go ninja-build pkg-config \
            libpcre2-dev zlib1g-dev libxml2-dev libxslt1-dev libgd-dev libgeoip-dev \
            libgoogle-perftools-dev libperl-dev libbrotli-dev

      - name: Resolve latest Nginx version
        id: nginx
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_ROOT}"
          nginx_version="$({
            curl -fsSL https://nginx.org/download/ \
              | grep -oE 'nginx-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
              | sed 's/\.tar\.gz$//' \
              | sort -V \
              | tail -n 1
          })"
          if [ -z "${nginx_version}" ]; then
            echo "Failed to resolve latest Nginx version from https://nginx.org/download/" >&2
            exit 1
          fi
          echo "nginx_version=${nginx_version}" >> "${GITHUB_OUTPUT}"
          echo "nginx_semver=${nginx_version#nginx-}" >> "${GITHUB_OUTPUT}"

      - name: Download Nginx source
        run: |
          set -euxo pipefail
          cd "${BUILD_ROOT}"
          curl -fsSL -o "${{ steps.nginx.outputs.nginx_version }}.tar.gz" \
            "https://nginx.org/download/${{ steps.nginx.outputs.nginx_version }}.tar.gz"
          tar -zxf "${{ steps.nginx.outputs.nginx_version }}.tar.gz"

      - name: Build BoringSSL
        id: boringssl
        run: |
          set -euxo pipefail
          cd "${BUILD_ROOT}"
          git clone --depth=1 https://github.com/google/boringssl
          boringssl_sha="$(git -C boringssl rev-parse --short=12 HEAD)"
          boringssl_date="$(git -C boringssl show -s --format=%cd --date=format:%Y%m%d HEAD)"
          echo "boringssl_version=${boringssl_date}-${boringssl_sha}" >> "${GITHUB_OUTPUT}"
          cmake -S boringssl -B boringssl/build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=0
          ninja -C boringssl/build -j"$(nproc)"
          test -f "$(find "${BUILD_ROOT}/boringssl/build" -name libssl.a -print -quit)"
          test -f "$(find "${BUILD_ROOT}/boringssl/build" -name libcrypto.a -print -quit)"

      - name: Configure and compile Nginx
        run: |
          set -euxo pipefail
          cd "${BUILD_ROOT}/${{ steps.nginx.outputs.nginx_version }}"

          sed -i "s/OPTIMIZE[ \\t]*=>[ \\t]*'-O'/OPTIMIZE          => '-O3'/g" src/http/modules/perl/Makefile.PL
          sed -i 's/NGX_PERL_CFLAGS="$CFLAGS `$NGX_PERL -MExtUtils::Embed -e ccopts`"/NGX_PERL_CFLAGS="`$NGX_PERL -MExtUtils::Embed -e ccopts` $CFLAGS"/g' auto/lib/perl/conf
          sed -i 's/NGX_PM_CFLAGS=`$NGX_PERL -MExtUtils::Embed -e ccopts`/NGX_PM_CFLAGS="`$NGX_PERL -MExtUtils::Embed -e ccopts` $CFLAGS"/g' auto/lib/perl/conf

          libssl_path="$(find "${BUILD_ROOT}/boringssl/build" -name libssl.a -print -quit)"
          libcrypto_path="$(find "${BUILD_ROOT}/boringssl/build" -name libcrypto.a -print -quit)"
          ssl_lib_dir="$(dirname "${libssl_path}")"
          crypto_lib_dir="$(dirname "${libcrypto_path}")"
          ld_opts="-L${ssl_lib_dir}"
          if [ "${crypto_lib_dir}" != "${ssl_lib_dir}" ]; then
            ld_opts="${ld_opts} -L${crypto_lib_dir}"
          fi
          ld_opts="${ld_opts} -lstdc++"

          ./configure \
            --prefix="${NGINX_PREFIX}" \
            --user=nginx \
            --group=nginx \
            --with-threads \
            --with-file-aio \
            --with-pcre-jit \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-http_realip_module \
            --with-http_addition_module \
            --with-http_xslt_module=dynamic \
            --with-http_image_filter_module=dynamic \
            --with-http_geoip_module=dynamic \
            --with-http_sub_module \
            --with-http_dav_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_auth_request_module \
            --with-http_random_index_module \
            --with-http_secure_link_module \
            --with-http_degradation_module \
            --with-http_slice_module \
            --with-http_stub_status_module \
            --with-http_perl_module=dynamic \
            --with-mail=dynamic \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_realip_module \
            --with-stream_geoip_module=dynamic \
            --with-stream_ssl_preread_module \
            --with-google_perftools_module \
            --with-compat \
            --with-cc-opt="-g0 -O3 -I${BUILD_ROOT}/boringssl/include" \
            --with-ld-opt="${ld_opts}"

          make -j"$(nproc)"
          objs/nginx -V

      - name: Package binary and metadata
        id: package
        run: |
          set -euxo pipefail
          release_time="$(date -u +%Y%m%d-%H%M%S)"
          release_name="${release_time}-nginx-${{ steps.nginx.outputs.nginx_semver }}-boringssl-${{ steps.boringssl.outputs.boringssl_version }}"
          package_dir="${BUILD_ROOT}/${release_name}"
          mkdir -p "${package_dir}/sbin" "${package_dir}/modules" "${package_dir}/logs"
          cp "${BUILD_ROOT}/${{ steps.nginx.outputs.nginx_version }}/objs/nginx" "${package_dir}/sbin/nginx"
          find "${BUILD_ROOT}/${{ steps.nginx.outputs.nginx_version }}/objs" -maxdepth 1 -name '*.so' -exec cp {} "${package_dir}/modules/" \;
          cat > "${package_dir}/BUILD_INFO.txt" <<INFO
          Release: ${release_name}
          Built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Nginx version: ${{ steps.nginx.outputs.nginx_semver }}
          Nginx source: https://nginx.org/download/${{ steps.nginx.outputs.nginx_version }}.tar.gz
          BoringSSL version: ${{ steps.boringssl.outputs.boringssl_version }}
          BoringSSL source: https://github.com/google/boringssl
          Prefix: ${NGINX_PREFIX}
          INFO
          "${package_dir}/sbin/nginx" -V > "${package_dir}/NGINX_VERSION.txt" 2>&1
          tar -C "${BUILD_ROOT}" -czf "${BUILD_ROOT}/${release_name}.tar.gz" "${release_name}"
          sha256sum "${BUILD_ROOT}/${release_name}.tar.gz" > "${BUILD_ROOT}/${release_name}.tar.gz.sha256"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "archive=${BUILD_ROOT}/${release_name}.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "checksum=${BUILD_ROOT}/${release_name}.tar.gz.sha256" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release create "${{ steps.package.outputs.release_tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --title "${{ steps.package.outputs.release_name }}" \
            --notes "Automated Nginx binary build with BoringSSL.\n\nNginx: ${{ steps.nginx.outputs.nginx_semver }}\nBoringSSL: ${{ steps.boringssl.outputs.boringssl_version }}"
