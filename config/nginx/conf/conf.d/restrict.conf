server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    # 默认 server 也要放行 ACME HTTP-01 挑战路径：证书续期时 acme.sh 用 80 端口
    # webroot 验证，请求可能落在默认 server 上（域名未命中任何 server_name）。
    # server 级 return 在 rewrite 阶段执行、先于 location 匹配，所以普通请求的拒绝
    # 必须放进 location /，否则这里的 return 444 会让挑战路径永远不可达。
    include     nginxconfig.io/zerossl.conf;

    location / {
        return 444;
    }
}

server {
    listen               unix:/dev/shm/nginx/default_backend.sock ssl proxy_protocol default_server;
    set_real_ip_from     unix:;
    real_ip_header       proxy_protocol;
    ssl_reject_handshake on;
    return               444;
}
